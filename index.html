                const dimScores = {};
                const dimCounts = {};

                        grp.items.forEach(item => {
                            const raw = answers[item.id];

                                if (!dimScores[item.dim]) {
                                    dimScores[item.dim] = 0;
                                    dimCounts[item.dim] = 0;
                                }
                                dimScores[item.dim] += score;
                                dimCounts[item.dim] += 1;
                            }
                        });
                    });
                });

                const averages = {};
                let overallSum = 0;
                let overallCount = 0;

                Object.keys(dimScores).forEach(dim => {
                    averages[dim] = dimScores[dim] / dimCounts[dim];
                    overallSum += averages[dim];
                    overallCount += 1;
                });

                const globalMean = overallCount > 0 ? (overallSum / overallCount) : 4.0;

                // Within-person Ipsative Z-score calculation
                const ipsative = {};
                Object.keys(averages).forEach(dim => {
                    ipsative[dim] = parseFloat((averages[dim] - globalMean).toFixed(2));

                                                                    <input
                                                                        type="radio"
                                                                        id={`${item.id}_${num}`}
                                                                        name={item.id}
                                                                        value={num}
                                                                        checked={answers[item.id] === num}
                                                                        onChange={(e) => handleLikertChange(item.id, e.target.value)}
                                                                        className="sr-only custom-radio"
                                                                    />
                                                                    <label
                                                                        htmlFor={`${item.id}_${num}`}
                                                                        className="block w-full py-2 rounded-lg border border-eggshell-300 text-xs font-semibold font-mono text-charcoal-700 bg-eggshell-50 cursor-pointer hover:bg-sage-100 transition text-center"
                                                                    >
                                                                        {num}
                                                                    </label>
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <div className="flex justify-between max-w-2xl text-[10px] text-charcoal-600 mt-1 px-1">
                                                            <span>1 (非常不同意)</span>
                                                            <span>4 (一半一半)</span>
                                                            <span>7 (非常同意)</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Render Open-Ended Tasks */}
                    {activePart === 'OPEN' && (
                        <div className="space-y-6">
                            <div className="mb-4">
                                <h2 className="text-xl font-bold font-serif-title text-sage-900">III-B｜开放式行为任务</h2>
                                <p className="text-xs text-sand-800 mt-1">请快速自然撰写，不要刻意润色。语言模式将用于AI建模与多方法交叉验证。</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {OPEN_TASKS.map(task => (
                                    <div key={task.id} className="paper-card rounded-2xl p-5 border border-eggshell-300 flex flex-col justify-between">
                                        <div>
                                            <div className="flex items-center justify-between mb-2">
                                                <span className="text-xs font-bold font-mono text-sage-800 bg-sage-100 px-2.5 py-1 rounded-md">
                                                    {task.label}
                                                </span>
                                            </div>
                                            <p className="text-xs sm:text-sm text-charcoal-800 font-medium mb-3">
                                                {task.prompt}
                                            </p>
                                        </div>
                                        <textarea
                                            rows="4"
                                            value={openAnswers[task.id] || ''}
                                            onChange={(e) => handleOpenChange(task.id, e.target.value)}
                                            placeholder="请输入你的真实回答..."
                                            className="w-full p-3 rounded-xl border border-eggshell-300 bg-eggshell-50 text-xs sm:text-sm text-charcoal-900 focus:ring-2 focus:ring-sage-500 focus:outline-none transition resize-none font-sans"
                                        ></textarea>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- SUB-COMPONENT 2: REPORT & AI PROMPT ENGINE ---
        function ReportView({ computedProfile, openAnswers, showToast }) {
            const chartRef = useRef(null);
            const chartInstanceRef = useRef(null);
            const [copied, setCopied] = useState(false);

            const { averages, ipsative, globalMean, count } = computedProfile;

            // Prepare radar chart
            useEffect(() => {
                if (!chartRef.current) return;

                const labels = Object.keys(DIMENSIONS_META).map(k => DIMENSIONS_META[k].name.split(' ')[0]);
                const dataValues = Object.keys(DIMENSIONS_META).map(k => averages[k] ? parseFloat(averages[k].toFixed(2)) : 0);

                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                chartInstanceRef.current = new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '维度平均得分 (1-7)',
                            data: dataValues,
                            backgroundColor: 'rgba(74, 107, 93, 0.25)',
                            borderColor: '#4A6B5D',
                            borderWidth: 2,
                            pointBackgroundColor: '#2D4238',
                            pointBorderColor: '#fff',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#2D4238'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            r: {
                                min: 1,
                                max: 7,
                                ticks: { stepSize: 1, display: false },
                                grid: { color: '#E6DFCE' },
                                angleLines: { color: '#E6DFCE' },
                                pointLabels: {
                                    font: { size: 10, family: 'Inter' },
                                    color: '#2C3531'
                                }
                            }
                        },
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });

                return () => {
                    if (chartInstanceRef.current) chartInstanceRef.current.destroy();
                };
            }, [averages]);

            // Synthesize System Prompt for LLM Agent Simulation
            const generatedSystemPrompt = useMemo(() => {
                if (count === 0) return '请先在【问卷测评作答】中完成题目，或载入示例数据生成 AI 建模 Prompt。';

                // Top dominant traits and lowest traits in within-person profile
                const sortedDims = Object.keys(ipsative).sort((a, b) => ipsative[b] - ipsative[a]);
                const topTraits = sortedDims.slice(0, 4).map(k => `${DIMENSIONS_META[k]?.name} (偏离均值 +${ipsative[k]})`);
                const lowTraits = sortedDims.slice(-3).map(k => `${DIMENSIONS_META[k]?.name} (偏离均值 ${ipsative[k]})`);

                return `[SYSTEM PROMPT / INDIVIDUAL PERSONA MODEL]
You are acting as an individual whose psychological profile, cognitive style, and behavioral traits are derived from the PCIP (Personality, Cognition & Interaction Profile v3.0) empirical idiographic assessment.

### 1. CORE TRAIT ARCHITECTURE (Within-Person Normalized Profile)
- Global Baseline Score: ${globalMean.toFixed(2)} / 7.00
- Dominant Internal Dimensions (High Relative Intensity):
  * ${topTraits.join('\n  * ')}
- Subordinate / Inhibited Dimensions:
  * ${lowTraits.join('\n  * ')}

### 2. COGNITIVE & PROCESSING MECHANISM (Cognitive Style)
- Metacognition & Self-Reflection: Score = ${(averages.Metacognition || 0).toFixed(2)} / 7.0 (High self-monitoring, continuous observation of thought formation).
- Cognitive Flexibility & Ambiguity Tolerance: Score = ${(averages.CogFlexibility || 0).toFixed(2)} / 7.0 (High tolerance for multi-angle paradoxes; avoids premature closure).
- Pattern Abstraction: Score = ${(averages.PatternAbstraction || 0).toFixed(2)} / 7.0 (Prone to extracting structural principles from everyday phenomena).

### 3. INTERPERSONAL & BOUNDARY DYNAMICS
- Interpersonal Distance & Autonomy: Score = ${(averages.InterpersonalDist || 0).toFixed(2)} / 7.0 (Prioritizes private autonomy, low codependency).
- Boundary Orientation & Detachment: Score = ${(averages.Boundary || 0).toFixed(2)} / 7.0 (Clear boundary enforcement, swift emotional detachment if violated).
- Linguistic Sensitivity: Score = ${(averages.LinguisticSens || 0).toFixed(2)} / 7.0 (Highly sensitive to phrasing, rhetorical flaws, and conversational tone).

### 4. QUALITATIVE DISCOURSE & LINGUISTIC SAMPLES (Natural Language Grounding)
- Self-Definition: "${openAnswers.O1 || 'Unspecified'}"
- Aesthetic Philosophy: "${openAnswers.O2 || 'Unspecified'}"
- Relational Thought Pattern: "${openAnswers.O3 || 'Unspecified'}"
- Response to Conflict/Labels: "${openAnswers.O4 || 'Unspecified'}"
- Philosophical Interpretation ("Freedom"): "${openAnswers.O5 || 'Unspecified'}"
- Natural Dialogue Style: "${openAnswers.O6 || 'Unspecified'}"

### 5. INTERACTION & CONVERSATIONAL INSTRUCTIONS FOR AI
1. DO NOT speak in generic, overly polite, or customer-service template tones.
2. Maintain intellectual rigor and structural clarity; prioritize nuanced explanation over superficial agreement.
3. Express boundary awareness naturally when presented with over-simplified assumptions or psychological labeling.
4. Adapt tone dynamically based on conversational context while preserving the cognitive style documented above.`;
            }, [computedProfile, openAnswers]);

            // Copy Prompt to Clipboard
            const copyPrompt = () => {
                const text = generatedSystemPrompt;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        setCopied(true);
                        showToast('AI System Prompt 已成功复制到剪贴板！');
                        setTimeout(() => setCopied(false), 2000);
                    });
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setCopied(true);
                    showToast('AI System Prompt 已复制到剪贴板！');
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            return (
                <div className="space-y-8">
                    {/* Upper Row: Radar Chart + Score Summary */}
                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Radar Chart Card */}
                        <div className="lg:col-span-6 paper-card rounded-2xl p-6 border border-eggshell-300 flex flex-col justify-between">
                            <div>
                                <h3 className="text-lg font-bold font-serif-title text-sage-900 mb-1">
                                    个体内特质雷达分布 (Ipsative Radar)
                                </h3>
                                <p className="text-xs text-sand-800 mb-4">
                                    展示 12 个核心维度得分。绝对分数基于 1–7 Likert 量表。
                                </p>
                            </div>
                            <div className="relative w-full h-80">
                                <canvas ref={chartRef}></canvas>
                            </div>
                            <div className="text-center text-xs text-charcoal-600 font-mono mt-3 pt-3 border-t border-eggshell-200">
                                全局特质均值 Baseline: {globalMean.toFixed(2)} / 7.00
                            </div>
                        </div>

                        {/* Dimension Breakdown List */}
                        <div className="lg:col-span-6 paper-card rounded-2xl p-6 border border-eggshell-300 flex flex-col justify-between">
                            <div>
                                <h3 className="text-lg font-bold font-serif-title text-sage-900 mb-1">
                                    维度相对强度 (Within-Person Z-Score)
                                </h3>
                                <p className="text-xs text-sand-800 mb-4">
                                    以个体自身全局均值为基准 (0.00)，评估特质的相对突出程度。
                                </p>
                            </div>

                            <div className="space-y-3 overflow-y-auto max-h-80 pr-2">
                                {Object.keys(DIMENSIONS_META).map(key => {
                                    const meta = DIMENSIONS_META[key];
                                    const avg = averages[key] || 0;
                                    const dev = ipsative[key] || 0;
                                    const isPositive = dev >= 0;

                                    return (
                                        <div key={key} className="bg-eggshell-50 p-2.5 rounded-xl border border-eggshell-200 flex items-center justify-between text-xs">
                                            <div className="flex items-center gap-2 max-w-[60%]">
                                                <span className="w-2 h-2 rounded-full" style={{ backgroundColor: meta.color }}></span>
                                                <span className="font-medium text-charcoal-900 truncate">{meta.name.split(' ')[0]}</span>
                                            </div>
                                            <div className="flex items-center gap-3 font-mono">
                                                <span className="text-charcoal-600">均分: {avg.toFixed(2)}</span>
                                                <span className={`px-2 py-0.5 rounded font-bold ${
                                                    isPositive ? 'bg-sage-100 text-sage-800' : 'bg-sand-100 text-sand-800'
                                                }`}>
                                                    {isPositive ? `+${dev.toFixed(2)}` : dev.toFixed(2)}
                                                </span>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Lower Section: AI System Prompt Generator */}
                    <div className="paper-card rounded-2xl p-6 sm:p-8 border border-eggshell-300 space-y-4">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-eggshell-200 pb-4">
                            <div>
                                <h3 className="text-xl font-bold font-serif-title text-sage-900 flex items-center gap-2">
                                    <i className="fa-solid fa-robot text-sage-600"></i>
                                    LLM 模拟模型 System Prompt 生成器
                                </h3>
                                <p className="text-xs text-sand-800 mt-1">
                                    将量化维度结果与开放式质性文本融合，直接生成可投喂给 GPT-4 / Claude 的 Persona Prompt。
                                </p>
                            </div>
                            <button
                                onClick={copyPrompt}
                                className="px-5 py-2.5 bg-sage-700 hover:bg-sage-800 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-sm self-start sm:self-auto"
                            >
                                <i className={`fa-solid ${copied ? 'fa-check' : 'fa-copy'}`}></i>
                                {copied ? '已复制 Prompt' : '一键复制 Prompt'}
                            </button>
                        </div>

                        <div className="relative">
                            <pre className="w-full p-4 rounded-xl bg-charcoal-900 text-eggshell-100 text-xs font-mono leading-relaxed overflow-x-auto whitespace-pre-wrap max-h-96 border border-charcoal-800">
                                {generatedSystemPrompt}
                            </pre>
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT 3: THEORETICAL FRAMEWORK ---
        function FrameworkView() {
            return (
                <div className="paper-card rounded-2xl p-6 sm:p-10 border border-eggshell-300 space-y-8">
                    <div>
                        <span className="sage-badge px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider">
                            Methodology & Theory
                        </span>
                        <h2 className="text-2xl font-bold font-serif-title text-sage-900 mt-3">
                            PCIP 理论测量框架与方法论说明
                        </h2>
                        <p className="text-sm text-sand-800 mt-1">
                            Personality, Cognition & Interaction Profile — 结构架构与心理测量学依据
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-xs sm:text-sm text-charcoal-800">
                        <div className="paper-panel p-5 rounded-xl border border-eggshell-300 space-y-2">
                            <div className="font-bold text-sage-800 font-serif-title text-base">第一层：核心人格特质</div>
                            <p className="text-xs leading-relaxed text-charcoal-700">
                                参考 Big Five (DeYoung 10 Aspect 模型) 与 HEXACO 6因素结构（如 Openness / Intellect、Emotionality、Honesty-Humility）。侧重稳定心理倾向。
                            </p>
                        </div>
                        <div className="paper-panel p-5 rounded-xl border border-eggshell-300 space-y-2">
                            <div className="font-bold text-sage-800 font-serif-title text-base">第二层：认知与加工风格</div>
                            <p className="text-xs leading-relaxed text-charcoal-700">
                                借鉴 Kruglanski 的认知闭合需求 (Need for Closure)、元认知 (Metacognition) 与认知灵活性理论。评估信息加工与不确定性容忍度。
                            </p>
                        </div>
                        <div className="paper-panel p-5 rounded-xl border border-eggshell-300 space-y-2">
                            <div className="font-bold text-sage-800 font-serif-title text-base">第三层：行为与语言表达</div>
                            <p className="text-xs leading-relaxed text-charcoal-700">
                                建立“特质 → 认知机制 → 情境 → 语言呈现”的生成模型。包含人际边界、审美倾向与语篇反讽、抽象度特征。
                            </p>
                        </div>
                    </div>

                    {/* Academic Literature References */}
                    <div className="border-t border-eggshell-200 pt-6 space-y-4">
                        <h3 className="text-base font-bold font-serif-title text-sage-900">核心学术参考文献体系</h3>
                        <ul className="space-y-3 font-mono text-xs text-charcoal-700">
                            <li className="bg-eggshell-50 p-3 rounded-lg border border-eggshell-200">
                                <span className="font-bold text-sage-800">Big Five Aspect Level:</span> DeYoung, C. G., Quilty, L. C., & Peterson, J. B. (2007). Between facets and domains: 10 aspects of the Big Five. <i>Journal of Personality and Social Psychology</i>, 93(5), 880–896.
                            </li>
                            <li className="bg-eggshell-50 p-3 rounded-lg border border-eggshell-200">
                                <span className="font-bold text-sage-800">HEXACO Structural Model:</span> Ashton, M. C., & Lee, K. (2007). Empirical, theoretical, and practical advantages of the HEXACO model of personality structure. <i>Personality and Social Psychology Review</i>, 11, 150–166.
                            </li>
                            <li className="bg-eggshell-50 p-3 rounded-lg border border-eggshell-200">
                                <span className="font-bold text-sage-800">Need for Cognitive Closure:</span> Kruglanski, A. W., & Webster, D. M. (1996). Motivated closing of the mind: "Seizing" and "freezing". <i>Psychological Review</i>, 103(2), 263–283.
                            </li>
                        </ul>
                    </div>

                    {/* Research Notice */}
                    <div className="bg-sand-100 p-5 rounded-xl border border-sand-200 text-xs leading-relaxed text-sand-800 space-y-1">
                        <div className="font-bold text-sand-900 flex items-center gap-2">
                            <i className="fa-solid fa-triangle-exclamation"></i> 研究设计学术声明 (Academic Research Disclaimer)
                        </div>
                        <p>
                            本问卷为研究取向的个体画像 (Idiographic Profile) 探索工具，并非经过临床大样本常模验证的标准诊断量表。测量得分采用个体内部标准化 (Ipsative Within-Person Normalization) 进行解释，不可直接用于临床心理诊断。
                        </p>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT 4: DATA EXPORT ---
        function ExportView({ answers, openAnswers, showToast }) {
            const [copiedFormat, setCopiedFormat] = useState(false);

            // Format raw text block
            const formattedOutput = useMemo(() => {
                let out = 'PART I\n';
                for (let i = 1; i <= 48; i++) {
                    const key = `A${i}`;
                    out += `${key}:${answers[key] !== undefined ? answers[key] : ''}\n`;
                }

                out += 'PART II\n';
                for (let i = 1; i <= 40; i++) {
                    const key = `B${i}`;
                    out += `${key}:${answers[key] !== undefined ? answers[key] : ''}\n`;
                }

                out += 'PART III\n';
                for (let i = 1; i <= 32; i++) {
                    const key = `C${i}`;
                    out += `${key}:${answers[key] !== undefined ? answers[key] : ''}\n`;
                }

                out += 'OPEN\n';
                for (let i = 1; i <= 8; i++) {
                    const key = `O${i}`;
                    out += `${key}:${openAnswers[key] ? openAnswers[key].replace(/\n/g, ' ') : ''}\n`;
                }

                return out;
            }, [answers, openAnswers]);

            const copyFormattedText = () => {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(formattedOutput).then(() => {
                        setCopiedFormat(true);
                        showToast('答题数据已复制为标准格式！');
                        setTimeout(() => setCopiedFormat(false), 2000);
                    });
                } else {
                    const textarea = document.createElement('textarea');
                    textarea.value = formattedOutput;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    setCopiedFormat(true);
                    showToast('答题数据已复制！');
                    setTimeout(() => setCopiedFormat(false), 2000);
                }
            };

            return (
                <div className="paper-card rounded-2xl p-6 sm:p-8 border border-eggshell-300 space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-eggshell-200 pb-4">
                        <div>
                            <h3 className="text-xl font-bold font-serif-title text-sage-900">
                                标准格式化答题文本导出
                            </h3>
                            <p className="text-xs text-sand-800 mt-1">
                                可直接复制以下文本提交至后续统计分析或存档。
                            </p>
                        </div>
                        <button
                            onClick={copyFormattedText}
                            className="px-5 py-2.5 bg-sage-700 hover:bg-sage-800 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-sm self-start sm:self-auto"
                        >
                            <i className={`fa-solid ${copiedFormat ? 'fa-check' : 'fa-copy'}`}></i>
                            {copiedFormat ? '已复制文本' : '复制标准格式文本'}
                        </button>
                    </div>

                    <pre className="w-full p-4 rounded-xl bg-eggshell-50 text-charcoal-900 text-xs font-mono leading-relaxed overflow-x-auto whitespace-pre-wrap max-h-96 border border-eggshell-300">
                        {formattedOutput}
                    </pre>
                </div>
            );
        }

        // --- RENDER APP ON WINDOW LOAD ---
        window.onload = function() {
            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        };
    </script>
</body>
</html>
